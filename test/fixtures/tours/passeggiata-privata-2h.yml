it:
  title: Passeggiata privata (2 ore)
  subtitle: Una guida tutta per voi, tema a scelta
  summary: "Due ore su misura: storia, arte, cucina, fotografia o semplicemente la Venezia che non conosci."
  meetingPoint: Concordato con te al momento della prenotazione
  meetingUrl: ''
  description: |
    La formula più semplice e flessibile: scegli giorno e orario, scegli un tema e ci pensiamo insieme. Dai ponti e dai campielli nascosti ai luoghi del cibo e delle tradizioni, dal Rinascimento alle storie di famiglia.

    Perfetta per chi ha poco tempo, per chi viaggia con bambini o per chi vuole un primo orientamento prima di esplorare da solo.
  highlights:
    - Itinerario costruito su di voi
    - Orario di inizio a scelta
    - "Tema a scelta: storia, arte, religioni, cucina veneziana, fotografia"
  includes:
    - Guida abilitata, in italiano, inglese o spagnolo
  excludes:
    - Ingressi, trasporti, mance
  notes: Prezzo per l'intero gruppo, fino a 12 persone.

en:
  title: Private walk (2 hours)
  subtitle: A guide just for you, theme of your choice
  summary: "Two tailor-made hours: history, art, food, photography or simply the Venice you do not know yet."
  meetingPoint: Agreed with you when booking
  meetingUrl: ''
  description: |
    The simplest and most flexible option: choose the day and time, choose a theme and we shape it together. From hidden bridges and squares to places of food and tradition, from the Renaissance to family stories.

    Perfect if you are short on time, travelling with children or want a first orientation before exploring on your own.
  highlights:
    - Itinerary built around you
    - Start time of your choice
    - "Theme of your choice: history, art, religions, Venetian food, photography"
  includes:
    - Licensed guide, in Italian, English or Spanish
  excludes:
    - Entry tickets, transport, tips
  notes: Price for the whole group, up to 12 guests.

es:
  title: Paseo privado (2 horas)
  subtitle: Un guía solo para ti, con el tema que elijas
  summary: "Dos horas a medida: historia, arte, gastronomía, fotografía o simplemente la Venecia que no conoces."
  meetingPoint: A convenir contigo al hacer la reserva
  meetingUrl: ''
  description: |
    La fórmula más sencilla y flexible: eliges el día y la hora, eliges un tema y lo preparamos juntos. Desde los puentes y las plazuelas escondidos hasta los lugares de la gastronomía y las tradiciones, desde el Renacimiento hasta las historias de familia.

    Perfecta para quien tiene poco tiempo, para quien viaja con niños o para quien quiere una primera orientación antes de explorar por su cuenta.
  highlights:
    - Itinerario hecho a tu medida
    - Hora de inicio a tu elección
    - "Tema a tu elección: historia, arte, religiones, cocina veneciana, fotografía"
  includes:
    - Guía turístico habilitado, en italiano, inglés o español
  excludes:
    - Entradas, transportes, propinas
  notes: Precio para todo el grupo, hasta 12 personas.
