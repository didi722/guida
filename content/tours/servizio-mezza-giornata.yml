it:
  title: Servizio guida mezza giornata
  subtitle: 4 ore di servizio per gruppi e agenzie
  summary: "La formula classica per gruppi, DMC e tour operator: una guida abilitata per mezza giornata."
  meetingPoint: Concordato con te (hotel, molo, terminal)
  meetingUrl: ''
  description: |
    Servizio di guida abilitata della durata di 4 ore, con inizio a vostra scelta. Pensato per gruppi organizzati, agenzie e DMC che hanno bisogno di un professionista affidabile, puntuale e preparato su Venezia.

    L'itinerario viene concordato in anticipo in base al programma del gruppo, al tempo disponibile e alle esigenze logistiche (arrivo da hotel, nave da crociera, molo, terminal).
  highlights:
    - Guida abilitata per 4 ore consecutive
    - Itinerario concordato in anticipo
    - Gruppi fino a 25 persone, nel rispetto dei limiti previsti dal Comune
  includes:
    - Guida abilitata
    - Coordinamento preventivo con referente / capogruppo
  excludes:
    - Ingressi, trasporti, radioguide, mance
  notes: Prezzo per l'intero gruppo. Tariffa agevolata riservata a DMC, tour operator e agenzie con account partner.

