# Tour a piccolo gruppo (prezzo a persona, partenze fisse).
# I PREZZI SONO SEGNAPOSTO: sostituiscili con le tue tariffe.
order: 1
featured: true
# active: false     # nasconde il tour dal sito e blocca nuove prenotazioni (lo storico resta)
model: person            # person = a persona, partenze condivise | group = privato, prezzo a gruppo
times: ["09:30", "14:30"]
weekdays: [0, 1, 2, 3, 4, 5, 6]
duration: 150            # minuti
maxParticipants: 10
price: 35                # € a persona (pubblico)
b2bPrice: 28             # € a persona (tariffa agevolata per agenzie/DMC)
art: dome
languages: [it, en, es, ja]

it:
  title: San Marco e Rialto
  subtitle: Il cuore di Venezia in due ore e mezza
  summary: Dalla piazza al ponte più famoso, leggendo facciate, mosaici e calli come pagine di storia.
  meetingPoint: Piazza San Marco, davanti alla Basilica (il punto esatto è nell'email di conferma)
  meetingUrl: https://www.google.com/maps/search/?api=1&query=Piazza+San+Marco+Venezia
  description: |
    Piazza San Marco è il salotto di Venezia, ma anche un grande libro di pietra: ogni facciata, ogni mosaico, ogni colonna racconta come una repubblica di mercanti abbia costruito la propria immagine, il proprio potere e la propria fede.

    Partiamo dalla Basilica e dal Palazzo Ducale per capire *perché* Venezia è fatta così, poi ci lasciamo la folla alle spalle e attraversiamo le calli verso Rialto, il centro economico della città, tra botteghe, mercato e curiosità che non trovi sulle guide.

    Gruppi piccoli, ritmo rilassato, tante storie e pochi nomi da imparare a memoria.
  highlights:
    - La piazza e la facciata della Basilica, tra mosaici e simboli del potere veneziano
    - La Torre dell'Orologio e il Palazzo Ducale visti dall'esterno
    - Le calli meno battute fra San Marco e Rialto
    - Il Ponte di Rialto e il mercato storico
  includes:
    - Guida abilitata, in italiano, inglese, spagnolo o giapponese
    - Gruppo di massimo 10 persone
    - Consigli personalizzati su dove mangiare e cosa vedere dopo il tour
  excludes:
    - Ingressi a Basilica e Palazzo Ducale (ti aiuto a prenotarli, se vuoi)
    - Mance e consumazioni
  notes: Percorso a piedi di circa 3 km, con ponti e gradini. Consigliate scarpe comode.
  faq: |
    Si entra nella Basilica e nel Palazzo Ducale?
    Il tour li racconta dall'esterno e ti spiega cosa vedrai dentro. Gli ingressi non sono inclusi: se vuoi visitarli, ti aiuto a prenotare i biglietti e a scegliere l'orario migliore.

    Quanto si cammina?
    Circa 3 km in due ore e mezza, a ritmo rilassato e con qualche sosta. Ci sono ponti e gradini: porta scarpe comode.

    Posso prenotare anche per una sola persona?
    Sì. È un tour in piccolo gruppo (massimo 10 persone) e i posti si prenotano uno per uno.

en:
  title: St Mark's and Rialto
  subtitle: The heart of Venice in two and a half hours
  summary: From the square to the most famous bridge, reading façades, mosaics and alleys like pages of history.
  meetingPoint: St Mark's Square, in front of the Basilica (exact spot in your confirmation email)
  meetingUrl: https://www.google.com/maps/search/?api=1&query=Piazza+San+Marco+Venezia
  description: |
    St Mark's Square is Venice's drawing room, but also a great stone book: every façade, mosaic and column tells how a republic of merchants built its image, its power and its faith.

    We start from the Basilica and the Doge's Palace to understand *why* Venice looks the way it does, then leave the crowds behind and cross the alleys towards Rialto, the city's commercial heart, among workshops, market stalls and stories you will not find in the guidebooks.

    Small groups, relaxed pace, plenty of stories and few names to memorise.
  highlights:
    - The square and the Basilica façade, between mosaics and symbols of Venetian power
    - The Clock Tower and the Doge's Palace seen from the outside
    - The quieter alleys between St Mark's and Rialto
    - The Rialto Bridge and the historic market
  includes:
    - Licensed guide, in Italian, English, Spanish or Japanese
    - Group of 10 guests at most
    - Personal tips on where to eat and what to see next
  excludes:
    - Tickets for the Basilica and the Doge's Palace (happy to help you book them)
    - Tips and drinks
  notes: About 3 km on foot, with bridges and steps. Comfortable shoes recommended.
  faq: |
    Do we go inside the Basilica and the Doge's Palace?
    The tour tells you about them from the outside and explains what you will see inside. Tickets are not included: if you would like to visit, I will help you book them and choose the best time.

    How much walking is there?
    About 3 km over two and a half hours, at a relaxed pace with a few stops. There are bridges and steps, so wear comfortable shoes.

    Can I book for just one person?
    Yes. It is a small-group tour (up to 10 people) and places are booked one at a time.

es:
  title: San Marcos y Rialto
  subtitle: El corazón de Venecia en dos horas y media
  summary: De la plaza al puente más famoso, leyendo fachadas, mosaicos y calles como páginas de historia.
  meetingPoint: Plaza de San Marcos, frente a la basílica (el punto exacto se indica en el correo de confirmación)
  meetingUrl: https://www.google.com/maps/search/?api=1&query=Piazza+San+Marco+Venezia
  description: |
    La plaza de San Marcos es el salón de Venecia, pero también un gran libro de piedra: cada fachada, cada mosaico, cada columna cuenta cómo una república de mercaderes construyó su imagen, su poder y su fe.

    Partimos de la basílica y del Palacio Ducal para entender *por qué* Venecia es así; luego dejamos atrás a la multitud y atravesamos las calles hacia Rialto, el centro económico de la ciudad, entre tiendas, mercado y curiosidades que no encontrarás en las guías.

    Grupos pequeños, ritmo relajado, muchas historias y pocos nombres que aprender de memoria.
  highlights:
    - La plaza y la fachada de la basílica, entre mosaicos y símbolos del poder veneciano
    - La Torre del Reloj y el Palacio Ducal, vistos desde el exterior
    - Las calles menos transitadas entre San Marcos y Rialto
    - El Puente de Rialto y el mercado histórico
  includes:
    - Guía turístico habilitado, en italiano, inglés, español o japonés
    - Grupo de 10 personas como máximo
    - Consejos personalizados sobre dónde comer y qué ver después del tour
  excludes:
    - Entradas a la basílica y al Palacio Ducal (te ayudo a reservarlas, si quieres)
    - Propinas y consumiciones
  notes: Recorrido a pie de unos 3 km, con puentes y escalones. Se recomienda calzado cómodo.
  faq: |
    ¿Se entra en la Basílica y en el Palacio Ducal?
    El tour los explica desde fuera y te cuenta qué verás dentro. Las entradas no están incluidas: si quieres visitarlos, te ayudo a reservar las entradas y a elegir el mejor horario.

    ¿Cuánto se camina?
    Unos 3 km en dos horas y media, a ritmo tranquilo y con alguna parada. Hay puentes y escalones: lleva calzado cómodo.

    ¿Puedo reservar para una sola persona?
    Sí. Es un tour en grupo reducido (máximo 10 personas) y las plazas se reservan una a una.

ja:
  title: サン・マルコとリアルト
  subtitle: ヴェネツィアの中心部を2時間30分で
  summary: 広場からヴェネツィアで最も有名な橋まで、建物の正面やモザイク、路地を歴史のページのように読み解きながら歩きます。
  meetingPoint: サン・マルコ広場、サン・マルコ寺院の前（正確な集合場所はご予約確認メールでご案内します）
  meetingUrl: https://www.google.com/maps/search/?api=1&query=Piazza+San+Marco+Venezia
  description: |
    サン・マルコ広場はヴェネツィアの応接間であり、石でできた大きな一冊の本でもあります。どの建物の正面も、どのモザイクも、円柱の一本一本も、商人たちの共和国がどのように自らのイメージと権力、そして信仰を築き上げたのかを物語っています。

    まずはサン・マルコ寺院とドゥカーレ宮殿から、ヴェネツィアが*なぜ*このような街なのかを紐解きます。その後は人混みを後にして路地を抜け、街の経済の中心であるリアルトへ向かいます。商店や市場、そしてガイドブックには載っていない小さな発見に出会いながら歩きます。

    少人数のグループで、ゆったりとしたペースで巡ります。お話はたっぷりと、覚えていただく名前はほんのわずかです。
  highlights:
    - モザイクとヴェネツィアの権力の象徴に彩られた、広場とサン・マルコ寺院の正面
    - 時計塔とドゥカーレ宮殿を外から見学
    - サン・マルコとリアルトの間の、観光客の少ない路地
    - リアルト橋と歴史ある市場
  includes:
    - 公認ガイドによるご案内（イタリア語・英語・スペイン語・日本語）
    - 最大10名様の少人数グループ
    - ツアー後のお食事処や見どころについての、お客様に合わせたアドバイス
  excludes:
    - サン・マルコ寺院とドゥカーレ宮殿の入場料（ご希望の場合は予約のお手伝いをします）
    - チップ、飲食代
  notes: 徒歩で約3km、橋や階段があります。歩きやすい靴をおすすめします。
  faq: |
    サン・マルコ寺院とドゥカーレ宮殿の中にも入りますか？
    ツアーでは両方を外側からご紹介し、内部で何をご覧になれるかをご説明します。入場料は含まれていません。内部を見学されたい場合は、チケットの予約と、おすすめの時間帯の選択をお手伝いします。

    どのくらい歩きますか？
    2時間30分で約3kmです。ゆったりとしたペースで、途中で何度か立ち止まりながら歩きます。橋や階段がありますので、歩きやすい靴でお越しください。

    1名だけでも予約できますか？
    はい。少人数制のツアー（最大10名様）で、1名様ずつご予約いただけます。
