it:
  title: Venezia tra Oriente e Occidente
  subtitle: Visita privata a tema, a cura di uno storico delle religioni
  summary: "Bisanzio, Islam, comunità greche e armene, perfino il Giappone: la città-ponte raccontata dalle sue religioni."
  meetingPoint: Concordato con te in base alla zona dell'hotel (di solito nei pressi di San Marco)
  meetingUrl: ''
  description: |
    Venezia è sempre stata una porta: verso Costantinopoli, verso il mondo islamico, verso l'Asia. Per questo la città è piena di tracce che non ti aspetti: mosaici bizantini, archi che guardano a Oriente, magazzini di mercanti ottomani, chiese delle comunità greca e armena.

    In questa visita privata seguiamo il filo delle religioni e degli scambi culturali, dalla Basilica alle calli dei mercanti, fino a una storia poco nota: nel 1585 una delegazione di giovani giapponesi cristiani, educati dai gesuiti, fu ricevuta con grandi onori dalla Repubblica.

    Si può adattare a interessi, età e tempo a disposizione: ideale per coppie, famiglie con ragazzi, gruppi di amici o ospiti che hanno già visto «i classici».
  highlights:
    - La Basilica di San Marco come ponte con Bisanzio
    - Tracce islamiche e orientali nell'architettura veneziana
    - Il Fondaco dei Turchi e le comunità di mercanti stranieri
    - San Giorgio dei Greci e il mondo ortodosso a Venezia
    - "Il Giappone a Venezia: l'ambasceria Tenshō del 1585"
  includes:
    - Guida abilitata e storico delle religioni, in italiano, inglese, spagnolo o giapponese
    - Itinerario costruito sui vostri interessi
    - Orario a vostra scelta
  excludes:
    - Ingressi a monumenti e musei
    - Mance e consumazioni
  notes: Prezzo a tariffa oraria per l'intero gruppo, fino a 15 persone; festivi e orari serali hanno un supplemento.

en:
  title: Venice between East and West
  subtitle: A private themed visit, led by a historian of religions
  summary: "Byzantium, Islam, Greek and Armenian communities, even Japan: the bridge-city told through its religions."
  meetingPoint: Agreed with you according to your hotel area (usually near St Mark's)
  meetingUrl: ''
  description: |
    Venice has always been a gateway: to Constantinople, to the Islamic world, to Asia. That is why the city is full of unexpected traces: Byzantine mosaics, arches looking east, Ottoman merchants' warehouses, churches of the Greek and Armenian communities.

    On this private visit we follow the thread of religions and cultural exchange, from the Basilica to the merchants' alleys, up to a little-known story: in 1585 a delegation of young Japanese Christians, educated by the Jesuits, was received with great honours by the Republic.

    It adapts to your interests, ages and available time: ideal for couples, families with teenagers, groups of friends or guests who have already seen "the classics".
  highlights:
    - St Mark's Basilica as a bridge to Byzantium
    - Islamic and eastern traces in Venetian architecture
    - The Fondaco dei Turchi and the communities of foreign merchants
    - San Giorgio dei Greci and the Orthodox world in Venice
    - "Japan in Venice: the 1585 Tenshō embassy"
  includes:
    - Licensed guide and historian of religions, in Italian, English, Spanish or Japanese
    - Itinerary built around your interests
    - Start time of your choice
  excludes:
    - Entry tickets to monuments and museums
    - Tips and drinks
  notes: Hourly rate for the whole group, up to 15 guests; holidays and evening hours carry a supplement.

es:
  title: Venecia entre Oriente y Occidente
  subtitle: Visita privada temática, a cargo de un historiador de las religiones
  summary: "Bizancio, el islam, comunidades griegas y armenias, incluso Japón: la ciudad puente contada a través de sus religiones."
  meetingPoint: A convenir contigo según la zona del hotel (normalmente cerca de San Marcos)
  meetingUrl: ''
  description: |
    Venecia siempre ha sido una puerta: hacia Constantinopla, hacia el mundo islámico, hacia Asia. Por eso la ciudad está llena de huellas que no esperarías: mosaicos bizantinos, arcos que miran hacia Oriente, almacenes de mercaderes otomanos, iglesias de las comunidades griega y armenia.

    En esta visita privada seguimos el hilo de las religiones y de los intercambios culturales, desde la basílica hasta las calles de los mercaderes, y llegamos a una historia poco conocida: en 1585 una delegación de jóvenes japoneses cristianos, educados por los jesuitas, fue recibida con grandes honores por la República.

    Se puede adaptar a los intereses, las edades y el tiempo disponible: ideal para parejas, familias con adolescentes, grupos de amigos o visitantes que ya han visto «los clásicos».
  highlights:
    - La basílica de San Marcos como puente con Bizancio
    - Huellas islámicas y orientales en la arquitectura veneciana
    - El Fondaco dei Turchi y las comunidades de mercaderes extranjeros
    - San Giorgio dei Greci y el mundo ortodoxo en Venecia
    - "Japón en Venecia: la embajada Tenshō de 1585"
  includes:
    - Guía turístico habilitado e historiador de las religiones, en italiano, inglés, español o japonés
    - Itinerario construido según tus intereses
    - Horario a tu elección
  excludes:
    - Entradas a monumentos y museos
    - Propinas y consumiciones
  notes: Tarifa por horas para todo el grupo, hasta 15 personas; festivos y horario nocturno tienen suplemento.

ja:
  title: 東西が出会うヴェネツィア
  subtitle: 宗教史家がご案内する、テーマ型のプライベートツアー
  summary: "ビザンツ、イスラーム、ギリシャ人やアルメニア人の共同体、そして日本まで。東西の架け橋となった街ヴェネツィアを、宗教を通して語ります。"
  meetingPoint: ホテルの場所に合わせてご相談のうえ決定（通常はサン・マルコ付近）
  meetingUrl: ''
  description: |
    ヴェネツィアは昔から、コンスタンティノープルへ、イスラーム世界へ、そしてアジアへと通じる玄関口でした。そのため街には、思いがけない痕跡があふれています。ビザンティン様式のモザイク、東方の影響を映すアーチ、オスマン帝国の商人たちの倉庫、ギリシャ人やアルメニア人の共同体の教会がその例です。

    このプライベートツアーでは、宗教と文化交流の糸を追いながら、サン・マルコ寺院から商人たちの路地まで歩き、あまり知られていない物語にたどり着きます。1585年、イエズス会の教育を受けたキリスト教徒の日本人の若者たち（天正遣欧少年使節）が、ヴェネツィア共和国から大きな栄誉をもって迎えられました。

    ご興味や年齢、お時間に合わせて内容を調整できます。カップル、10代のお子様連れのご家族、ご友人同士のグループ、そしてすでに「定番」の名所を訪れたことのある方に向いています。
  highlights:
    - ビザンツ帝国との架け橋としてのサン・マルコ寺院
    - ヴェネツィアの建築に残るイスラームと東方の痕跡
    - フォンダコ・デイ・トゥルキ（トルコ人商館）と、外国人商人の共同体
    - サン・ジョルジョ・デイ・グレーチ教会と、ヴェネツィアの正教会の世界
    - "ヴェネツィアの中の日本：1585年の天正遣欧少年使節"
  includes:
    - 公認ガイド兼宗教史家によるご案内（イタリア語・英語・スペイン語・日本語）
    - ご興味に合わせて組み立てるルート
    - 開始時間はお好みでお選びいただけます
  excludes:
    - 歴史的建造物や博物館の入場料
    - チップ、飲食代
  notes: グループ全体に対する時間料金です（最大15名様まで）。日曜・祝祭日および夜間の時間帯は割増料金が適用されます。
