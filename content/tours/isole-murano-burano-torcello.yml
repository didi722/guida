it:
  title: Murano, Burano e Torcello
  subtitle: Mezza giornata nella laguna
  summary: "Il vetro, il merletto e la cattedrale dei primi veneziani: tre isole, tre storie."
  meetingPoint: Concordato con te (di solito alla fermata Fondamente Nove o in zona San Marco)
  meetingUrl: ''
  description: |
    La laguna non è solo il «contorno» di Venezia: è il luogo da cui tutto è cominciato. Con una guida si capisce meglio il filo che lega le isole.

    A Murano seguiamo la storia del vetro e entriamo in una fornace; a Burano passeggiamo tra le case colorate e il merletto; a Torcello arriviamo alla cattedrale di Santa Maria Assunta, con i suoi mosaici bizantini, in uno dei primi insediamenti della laguna.

    Gli spostamenti avvengono in vaporetto (o in barca privata, su richiesta): si tratta di un ritmo lento, adatto a chi vuole vedere meno cose ma capirle di più.
  highlights:
    - "Murano: la storia del vetro e una dimostrazione in fornace"
    - "Burano: case colorate, merletti e vita di isola"
    - "Torcello: la cattedrale e i mosaici bizantini"
    - La laguna vista dall'acqua
  includes:
    - Guida abilitata per tutta la durata
    - Itinerario e orari adattati al vostro gruppo
  excludes:
    - Biglietti del vaporetto o noleggio barca privata
    - Ingresso alla cattedrale di Torcello
    - Pranzo, mance e consumazioni
  notes: Prezzo a tariffa oraria per l'intero gruppo, fino a 12 persone (battello escluso). In caso di maltempo severo concordiamo insieme un'alternativa o la data.

en:
  title: Murano, Burano and Torcello
  subtitle: A half day in the lagoon
  summary: "Glass, lace and the cathedral of the first Venetians: three islands, three stories."
  meetingPoint: Agreed with you (usually at the Fondamente Nove stop or around St Mark's)
  meetingUrl: ''
  description: |
    The lagoon is not just the "backdrop" of Venice: it is where everything began. A guide makes the thread connecting the islands much clearer.

    In Murano we follow the story of glass and step into a furnace; in Burano we stroll among coloured houses and lace; in Torcello we reach the cathedral of Santa Maria Assunta, with its Byzantine mosaics, in one of the lagoon's earliest settlements.

    We travel by water bus (or private boat, on request): a slow pace for those who prefer to see less but understand more.
  highlights:
    - "Murano: the story of glass and a furnace demonstration"
    - "Burano: coloured houses, lace and island life"
    - "Torcello: the cathedral and its Byzantine mosaics"
    - The lagoon seen from the water
  includes:
    - Licensed guide for the whole duration
    - Itinerary and timing adapted to your group
  excludes:
    - Water bus tickets or private boat hire
    - Entry to Torcello cathedral
    - Lunch, tips and drinks
  notes: Hourly rate for the whole group, up to 12 guests (boat not included). In case of severe weather we agree on an alternative or another date together.

es:
  title: Murano, Burano y Torcello
  subtitle: Media jornada en la laguna
  summary: "El vidrio, el encaje y la catedral de los primeros venecianos: tres islas, tres historias."
  meetingPoint: A convenir contigo (normalmente en la parada de Fondamente Nove o en la zona de San Marcos)
  meetingUrl: ''
  description: |
    La laguna no es solo el «telón de fondo» de Venecia: es el lugar donde todo empezó. Con un guía se entiende mejor el hilo que une las islas.

    En Murano seguimos la historia del vidrio y entramos en una fornace (horno de vidrio); en Burano paseamos entre casas de colores y encajes; en Torcello llegamos a la catedral de Santa Maria Assunta, con sus mosaicos bizantinos, en uno de los primeros asentamientos de la laguna.

    Los desplazamientos se hacen en vaporetto (o en barco privado, a petición): un ritmo lento, pensado para quien prefiere ver menos cosas pero entenderlas mejor.
  highlights:
    - "Murano: la historia del vidrio y una demostración en el horno"
    - "Burano: casas de colores, encajes y vida isleña"
    - "Torcello: la catedral y los mosaicos bizantinos"
    - La laguna vista desde el agua
  includes:
    - Guía turístico habilitado durante toda la excursión
    - Itinerario y horarios adaptados a tu grupo
  excludes:
    - Billetes de vaporetto o alquiler de barco privado
    - Entrada a la catedral de Torcello
    - Almuerzo, propinas y consumiciones
  notes: Tarifa por horas para todo el grupo, hasta 12 personas (barco no incluido). En caso de mal tiempo severo, acordamos juntos una alternativa u otra fecha.

ja:
  title: ムラーノ島、ブラーノ島、トルチェッロ島
  subtitle: ラグーナ（潟）で過ごす半日
  summary: "ガラス、レース、そして最初期のヴェネツィア人たちの大聖堂。3つの島、3つの物語。"
  meetingPoint: ご相談のうえ決定（通常はヴァポレットのフォンダメンテ・ノーヴェ停留所、またはサン・マルコ周辺）
  meetingUrl: ''
  description: |
    ラグーナ（潟）は、ヴェネツィアの単なる「背景」ではありません。すべてが始まった場所です。ガイドと一緒に巡ると、島々をつなぐ糸がよりはっきりと見えてきます。

    ムラーノ島ではガラスの歴史をたどり、ガラス工房に入ります。ブラーノ島では色とりどりの家々とレースを眺めながら散策します。トルチェッロ島では、ラグーナで最も初期の居住地の一つに建つサンタ・マリア・アッスンタ大聖堂を訪れ、ビザンティン様式のモザイクを見学します。

    島から島への移動はヴァポレット（水上バス）で行います（ご希望に応じて、プライベートボートも可能です）。ゆったりとしたペースで、たくさん見るよりも、見たものをじっくり理解したい方に向いています。
  highlights:
    - "ムラーノ島：ガラスの歴史と、ガラス工房での実演"
    - "ブラーノ島：色とりどりの家々、レース、島の暮らし"
    - "トルチェッロ島：大聖堂とビザンティン様式のモザイク"
    - 水上から眺めるラグーナ（潟）
  includes:
    - 全行程に同行する公認ガイド
    - グループに合わせて調整するルートとスケジュール
  excludes:
    - ヴァポレットの乗船券、またはプライベートボートのチャーター料
    - トルチェッロ島の大聖堂の入場料
    - 昼食、チップ、その他の飲食代
  notes: グループ全体に対する時間料金です（最大12名様、船賃は含まれません）。荒天の場合は、代わりのプランまたは別の日程を、ご相談のうえ決めます。
