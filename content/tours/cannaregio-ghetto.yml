it:
  title: Cannaregio e il Ghetto
  subtitle: La Venezia delle comunità e delle minoranze
  summary: Il quartiere più autentico, il primo Ghetto della storia e la chiesa dove riposa Tintoretto.
  meetingPoint: Ponte delle Guglie, Cannaregio (il punto esatto è nell'email di conferma)
  meetingUrl: https://www.google.com/maps/search/?api=1&query=Ponte+delle+Guglie+Venezia
  description: |
    Cannaregio è il sestiere dove Venezia torna a essere una città in cui si vive. Qui, nel 1516, la Repubblica stabilì il Ghetto: un luogo di segregazione, ma anche uno straordinario laboratorio di cultura, commercio e fede, da cui nasce la parola stessa «ghetto».

    Camminiamo tra campi, fondamenta e botteghe di quartiere, entriamo nella storia delle diverse comunità che hanno abitato la città (ebrea, ma anche greca, armena, tedesca) e arriviamo alla Madonna dell'Orto, la chiesa di Tintoretto.

    Un percorso per chi vuole capire Venezia anche attraverso le religioni e le convivenze che l'hanno fatta.
  highlights:
    - "Il Ghetto Nuovo e il Ghetto Vecchio: storia, architettura e vita quotidiana"
    - Le sinagoghe, viste dall'esterno (visita al museo opzionale)
    - La Madonna dell'Orto, parrocchia e sepolcro di Tintoretto
    - Fondamenta, botteghe e angoli lontani dal turismo di massa
  includes:
    - Guida abilitata, in italiano, inglese, spagnolo o giapponese
    - Gruppo di massimo 10 persone
    - Indicazioni per bacari e osterie di quartiere
  excludes:
    - Ingresso al Museo Ebraico e alle sinagoghe
    - Mance e consumazioni
  notes: Il Ghetto è un luogo vivo e sacro per la comunità ebraica. Chiediamo un abbigliamento e un comportamento rispettosi.
  faq: |
    Si entra nelle sinagoghe e nel Museo Ebraico?
    Le sinagoghe sono luoghi di culto ancora in uso e le vediamo dall'esterno. La visita del museo e delle sinagoghe è facoltativa e non è inclusa: se vuoi aggiungerla, ti aiuto a organizzarla.

    Serve un abbigliamento particolare?
    Il Ghetto è un luogo vivo e sacro per la comunità ebraica: chiediamo un abbigliamento sobrio e un comportamento rispettoso.

    Perché si chiama «ghetto»?
    La parola nasce proprio qui, a Venezia: nel 1516 la Repubblica destinò questo quartiere alla comunità ebraica. Durante il tour ti racconto da dove viene il nome e come la parola ha viaggiato nel mondo.

en:
  title: Cannaregio and the Ghetto
  subtitle: The Venice of communities and minorities
  summary: The most authentic district, the world's first Ghetto and the church where Tintoretto rests.
  meetingPoint: Ponte delle Guglie, Cannaregio (exact spot in your confirmation email)
  meetingUrl: https://www.google.com/maps/search/?api=1&query=Ponte+delle+Guglie+Venezia
  description: |
    Cannaregio is the district where Venice becomes a city to live in again. Here, in 1516, the Republic established the Ghetto: a place of segregation, but also an extraordinary laboratory of culture, trade and faith, and the origin of the very word "ghetto".

    We walk through squares, quaysides and neighbourhood workshops, step into the history of the communities that have lived in the city (Jewish, but also Greek, Armenian and German) and end at Madonna dell'Orto, Tintoretto's parish church.

    A route for those who want to understand Venice through the religions and coexistences that shaped it.
  highlights:
    - "The Ghetto Nuovo and Ghetto Vecchio: history, architecture and daily life"
    - The synagogues, seen from the outside (optional museum visit)
    - Madonna dell'Orto, Tintoretto's parish church and burial place
    - Quaysides, workshops and corners far from mass tourism
  includes:
    - Licensed guide, in Italian, English, Spanish or Japanese
    - Group of 10 guests at most
    - Tips for neighbourhood bacari and taverns
  excludes:
    - Entry to the Jewish Museum and the synagogues
    - Tips and drinks
  notes: The Ghetto is a living, sacred place for the Jewish community. We ask for respectful dress and behaviour.
  faq: |
    Do we go inside the synagogues and the Jewish Museum?
    The synagogues are active places of worship and we see them from the outside. Visiting the museum and the synagogues is optional and not included: if you would like to add it, I will help you arrange it.

    Is there a dress code?
    The Ghetto is a living, sacred place for the Jewish community: we ask for modest dress and respectful behaviour.

    Why is it called the "ghetto"?
    The word was born right here in Venice: in 1516 the Republic assigned this district to the Jewish community. During the tour I tell you where the name comes from and how the word travelled the world.

es:
  title: Cannaregio y el Ghetto
  subtitle: La Venecia de las comunidades y las minorías
  summary: El barrio más auténtico, el primer Ghetto de la historia y la iglesia donde descansa Tintoretto.
  meetingPoint: Ponte delle Guglie, Cannaregio (el punto exacto se indica en el correo de confirmación)
  meetingUrl: https://www.google.com/maps/search/?api=1&query=Ponte+delle+Guglie+Venezia
  description: |
    Cannaregio es el sestiere donde Venecia vuelve a ser una ciudad en la que se vive. Aquí, en 1516, la República estableció el Ghetto: un lugar de segregación, pero también un extraordinario laboratorio de cultura, comercio y fe, del que nace la propia palabra «ghetto».

    Caminamos entre plazas, fondamenta y tiendas de barrio, nos adentramos en la historia de las distintas comunidades que han habitado la ciudad (la judía, pero también la griega, la armenia y la alemana) y llegamos a la Madonna dell'Orto, la iglesia de Tintoretto.

    Un recorrido para quien quiere entender Venecia también a través de las religiones y de las formas de convivencia que la han moldeado.
  highlights:
    - "El Ghetto Nuovo y el Ghetto Vecchio: historia, arquitectura y vida cotidiana"
    - Las sinagogas, vistas desde el exterior (visita opcional al museo)
    - La Madonna dell'Orto, parroquia y sepulcro de Tintoretto
    - Fondamenta, tiendas y rincones lejos del turismo de masas
  includes:
    - Guía turístico habilitado, en italiano, inglés, español o japonés
    - Grupo de 10 personas como máximo
    - Sugerencias de bacari y tabernas del barrio
  excludes:
    - Entrada al Museo Judío y a las sinagogas
    - Propinas y consumiciones
  notes: El Ghetto es un lugar vivo y sagrado para la comunidad judía. Pedimos una vestimenta y un comportamiento respetuosos.
  faq: |
    ¿Se entra en las sinagogas y en el Museo Judío?
    Las sinagogas son lugares de culto todavía en uso y las vemos desde fuera. La visita al museo y a las sinagogas es opcional y no está incluida: si quieres añadirla, te ayudo a organizarla.

    ¿Hay que vestir de alguna manera?
    El Ghetto es un lugar vivo y sagrado para la comunidad judía: pedimos una vestimenta sobria y un comportamiento respetuoso.

    ¿Por qué se llama «gueto»?
    La palabra nació aquí mismo, en Venecia: en 1516 la República destinó este barrio a la comunidad judía. Durante el tour te cuento de dónde viene el nombre y cómo la palabra recorrió el mundo.

ja:
  title: カンナレージョ地区とゲットー
  subtitle: 共同体と少数派が息づくヴェネツィア
  summary: ヴェネツィアの素顔が最も残る地区、歴史上最初のゲットー、そしてティントレットが眠る教会。
  meetingPoint: グリエ橋（Ponte delle Guglie）、カンナレージョ地区（正確な集合場所はご予約確認メールでご案内します）
  meetingUrl: https://www.google.com/maps/search/?api=1&query=Ponte+delle+Guglie+Venezia
  description: |
    カンナレージョ地区は、ヴェネツィアが再び「人々が暮らす街」に戻る地区です。1516年、ヴェネツィア共和国はこの地にゲットー（ユダヤ人地区）を設けました。そこは隔離の場であったと同時に、文化・商業・信仰が驚くほど豊かに育まれた場所でもあり、「ゲットー」という言葉そのものの発祥の地でもあります。

    広場や運河沿いの道、地元の商店や工房の間を歩きながら、この街に暮らしてきたさまざまな共同体（ユダヤ人だけでなく、ギリシャ人、アルメニア人、ドイツ人も）の歴史に触れ、ティントレットの教会であるマドンナ・デッロルト教会にたどり着きます。

    ヴェネツィアを形づくってきた宗教や、異なる人々の共存のあり方を通しても、この街を知りたい方のためのコースです。
  highlights:
    - "ゲットー・ヌオーヴォとゲットー・ヴェッキオ：歴史、建築、日々の暮らし"
    - シナゴーグ（ユダヤ教会堂）を外から見学（博物館の見学はオプション）
    - "マドンナ・デッロルト教会：ティントレットの教区教会であり、墓所"
    - 観光客の波から離れた運河沿いの道、商店や工房、街角
  includes:
    - 公認ガイドによるご案内（イタリア語・英語・スペイン語・日本語）
    - 最大10名様の少人数グループ
    - 地元のバーカロ（立ち飲みの居酒屋）やオステリア（食堂）のご案内
  excludes:
    - ユダヤ博物館とシナゴーグの入場料
    - チップ、飲食代
  notes: ゲットーは、ユダヤ人共同体にとって今も暮らしと信仰が息づく神聖な場所です。敬意のある服装と振る舞いをお願いしております。
  faq: |
    シナゴーグやユダヤ博物館の中には入りますか？
    シナゴーグは今も礼拝に使われている場所のため、外からご覧いただきます。博物館とシナゴーグの見学は任意で、料金には含まれていません。ご希望の場合は、手配をお手伝いします。

    特別な服装は必要ですか？
    ゲットーはユダヤ人共同体にとって今も暮らしと信仰が息づく神聖な場所です。控えめな服装と、敬意のある振る舞いをお願いしております。

    なぜ「ゲットー」と呼ばれるのですか？
    この言葉が生まれたのは、まさにここヴェネツィアです。1516年、ヴェネツィア共和国はこの地区をユダヤ人共同体の居住区と定めました。ツアーの中で、名前の由来と、この言葉が世界へ広まっていった経緯をお話しします。
